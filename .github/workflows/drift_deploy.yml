name: Deploy Drift Detection Service

on:
  push:
    branches:
      - main
    paths:
      - 'src/drift_detection.py'
      - 'src/drift_api.py'
      - 'dockerfiles/drift.dockerfile'
      - 'drift_cloudbuild.yaml'
      - '.github/workflows/drift_deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: psychic-iridium-484208-c3
  REGION: europe-north1
  SERVICE_NAME: drift-detection-api

jobs:
  deploy:
    name: Deploy Drift Detection API
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config=drift_cloudbuild.yaml \
            --project=${{ env.PROJECT_ID }}

      - name: Verify deployment
        run: |
          # Get service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          
          echo "Drift Detection API deployed at: ${SERVICE_URL}"
          
          # Health check
          curl -f "${SERVICE_URL}/" || exit 1

      - name: Update Scheduler (if needed)
        run: |
          # Check if scheduler job exists
          if gcloud scheduler jobs describe drift-check-daily \
             --location=${{ env.REGION }} 2>/dev/null; then
            echo "Scheduler job already exists"
          else
            echo "Scheduler job needs to be created manually"
            echo "Run: uv run python scripts/setup_drift_scheduler.py ${{ env.PROJECT_ID }}"
          fi
