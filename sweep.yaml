program: src/train.py
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
name: ecg-classification-sweep
project: ecg-classification
metric:
    goal: minimize
    name: val_loss
method: bayes
parameters:
    model.lr:
        min: 0.00001
        max: 0.01
        distribution: log_uniform_values
    data.batch_size:
        values: [8, 16, 32]
    training.max_epochs:
        values: [5, 10, 20]
    seed:
        values: [2026, 11111, 0]
run_cap: 20