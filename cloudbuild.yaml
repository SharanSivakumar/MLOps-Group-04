substitutions:
  _REGION: europe-north1
  _AR_REPO: ml-images

steps:
  - id: "Build API image"
    name: "gcr.io/cloud-builders/docker"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "."
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api-image:latest"
      - "-f"
      - "dockerfiles/api.dockerfile"

  - id: "Push API image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api-image"

  - id: "Build frontend image"
    name: "gcr.io/cloud-builders/docker"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "frontend"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend-image:latest"
      - "-f"
      - "frontend/frontend.dockerfile"

  - id: "Push frontend image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend-image"


options:
  logging: CLOUD_LOGGING_ONLY
  machineType: N1_HIGHCPU_8
