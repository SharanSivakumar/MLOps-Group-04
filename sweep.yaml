program: src/train.py
name: ecg-classification-sweep
project: ecg-classification
metric:
    goal: minimize
    name: val_loss
method: bayes
parameters:
    model.lr:
        min: 0.00001
        max: 0.01
        distribution: log_uniform_values
    data.batch_size:
        values: [16, 32, 64, 128]
    training.max_epochs:
        values: [10, 20, 30, 50]
    seed:
        values: [42, 123, 456, 789]
run_cap: 20