name: Data Changes Workflow

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '*.dvc'
      - '.dvc/**'
      - '.dvcignore'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - '*.dvc'
      - '.dvc/**'
      - '.dvcignore'

jobs:
  validate-data:
    name: Validate Data Changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate DVC configuration
        run: |
          uv run dvc config -l

      - name: Check DVC files
        run: |
          echo "=== DVC Files ==="
          find . -name "*.dvc" -type f
          echo ""
          echo "=== DVC Status ==="
          uv run dvc status --not-in-remote || true

  validate-data-integrity:
    name: Test Data Integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run data tests
        run: uv run pytest tests/test_data.py -v

      - name: Validate data schema
        run: |
          uv run python -c "
          import torch
          import os
          data_path = 'data/processed'
          if os.path.exists(data_path):
              for file in os.listdir(data_path):
                  if file.endswith('.pt'):
                      data = torch.load(os.path.join(data_path, file))
                      print(f'{file}: shape={data[0].shape if isinstance(data, tuple) else data.shape}')
          else:
              print('Processed data directory not found')
          "

  data-validation-summary:
    name: Data Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-data, validate-data-integrity]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Check data directory structure
        run: |
          echo "=== Data Directory Structure ==="
          if [ -d "data" ]; then
            find data -type f -name "*.npy" | head -20 || echo "No .npy files found"
            find data -type f -name "*.pt" || echo "No .pt files found"
            echo ""
            echo "Data directory size:"
            du -sh data/
          else
            echo "Data directory not found"
          fi

      - name: Print validation summary
        run: |
          echo "✓ Data validation workflow completed"
          echo "Review the logs above for detailed information about data changes"
