workerPoolSpecs:
- machineSpec:
    machineType: n1-standard-4
  replicaCount: 1
  containerSpec:
    imageUri: europe-north1-docker.pkg.dev/psychic-iridium-484208-c3/ml-images/train-image:latest
    args:
    - --data_dir=data/time_series
    - --max_epochs=2
    - --batch_size=8
seed: 2026
data:
  data_dir: data/time_series
  processed_dir: data/processed
  batch_size: 4
  num_workers: 4
model:
  lr: 0.0014691594285984396
  num_classes: 3
training:
  max_epochs: 20
callbacks:
  early_stopping:
    patience: 5
    monitor: val_loss
    mode: min
  checkpoint:
    monitor: val_loss
    dirpath: checkpoints
    filename: ecg-{epoch:02d}-{val_loss:.2f}
    save_top_k: 1
    mode: min
logging:
  log_dir: lightning_logs
  name: ecg_classification
profiler:
  dirpath: profiler
  filename: perf_logs
  export_to_chrome: true
  row_limit: 20
  sort_by_key: cpu_time_total
